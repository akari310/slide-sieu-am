<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{TITLE}} — Mô phỏng Siêu âm (Vật lí 12)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* {{SIM_STYLES}} */
html, body {
  height: 100%;
  overflow-x: hidden;
  scroll-snap-type: none;
}
.sim-shell {
  min-height: 100dvh;
  height: 100dvh;
  max-width: 1580px;
  margin: 0 auto;
  padding: clamp(0.85rem, 1.8vh, 1.35rem) clamp(1rem, 2.6vw, 2.4rem);
  display: flex;
  flex-direction: column;
  gap: clamp(0.7rem, 1.4vh, 1.1rem);
}
.sim-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  padding-bottom: 0.65rem;
  border-bottom: 1px solid rgba(148, 197, 255, 0.16);
}
.sim-head-left {
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
  min-width: 0;
}
.sim-kicker {
  font-family: var(--mono);
  font-size: clamp(0.9rem, 1.1vw, 1.12rem);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-teal);
  padding-left: 0.7em;
  border-left: 4px solid var(--accent-teal);
}
.sim-title {
  margin: 0;
  font-size: clamp(1.38rem, 2.25vw, 2.15rem);
  font-weight: 800;
  color: var(--text-1);
  line-height: 1.2;
}
.sim-head-actions {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  flex-wrap: wrap;
}
.sim-pill {
  font-family: var(--mono);
  font-size: clamp(0.95rem, 1.12vw, 1.14rem);
  font-weight: 700;
  padding: 0.42em 0.85em;
  border-radius: 999px;
  border: 1px solid rgba(63, 227, 200, 0.38);
  background: rgba(63, 227, 200, 0.12);
  color: var(--accent-teal);
  white-space: nowrap;
}
.sim-back {
  font-family: var(--mono);
  font-size: clamp(0.88rem, 1.02vw, 1.04rem);
  font-weight: 600;
  padding: 0.42em 0.85em;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface-solid);
  color: var(--text-2);
  text-decoration: none;
  transition: border-color 0.15s, color 0.15s;
}
.sim-back:hover {
  border-color: var(--accent-teal);
  color: var(--accent-teal);
}
.sim-main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.48fr) minmax(300px, 0.72fr);
  gap: clamp(0.9rem, 2vw, 1.75rem);
  align-items: stretch;
}
.sim-main.single {
  grid-template-columns: 1fr;
}
.sim-stage {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.sim-stage > .lab {
  width: 100%;
  flex: 1;
  height: 100%;
  min-height: 0;
  padding: clamp(0.95rem, 1.5vw, 1.35rem);
  gap: 0.75rem;
}
.sim-stage > .lab[data-widget="freq"],
.sim-stage > .lab[data-widget="gel"] {
  flex: 0 0 auto;
  height: auto;
  width: 100%;
  gap: 1.05rem;
  padding: clamp(1.1rem, 1.8vw, 1.65rem);
}
.sim-stage .canvas-box {
  min-height: 290px;
}
.sim-notes {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.9rem;
}
.sim-notes p, .sim-notes li {
  font-size: clamp(1.18rem, 1.45vw, 1.48rem) !important;
  line-height: 1.52 !important;
  color: #dbe8f8;
}
.sim-notes .formula {
  font-size: clamp(1.22rem, 1.7vw, 1.62rem);
}
.sim-toast {
  position: fixed;
  left: 50%;
  bottom: 1.4rem;
  transform: translateX(-50%) translateY(14px);
  opacity: 0;
  pointer-events: none;
  padding: 0.55em 1.15em;
  border-radius: 999px;
  background: rgba(7, 21, 43, 0.95);
  border: 1px solid var(--accent-teal);
  color: var(--text-1);
  font-family: var(--mono);
  font-size: clamp(0.95rem, 1.1vw, 1.1rem);
  font-weight: 600;
  z-index: 90;
  transition: opacity 0.2s, transform 0.2s;
}
.sim-toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
@media (max-width: 980px) {
  .sim-shell { height: auto; }
  .sim-main { grid-template-columns: 1fr; }
  .sim-stage .canvas-box { min-height: 320px; }
}
</style>
</head>
<body>
<div class="sim-shell">
  <header class="sim-head">
    <div class="sim-head-left">
      <span class="sim-kicker">{{KICKER}}</span>
      <h1 class="sim-title">{{TITLE}}</h1>
    </div>
    <div class="sim-head-actions">
      {{FORMULA_PILL}}
      <a class="sim-back" href="./" title="Xem toàn bộ thí nghiệm mô phỏng">☰ Danh sách TN</a>
      <button class="sim-back" type="button" onclick="window.close()" title="Đóng tab quay lại slide">✕ Đóng tab (Ctrl+W)</button>
    </div>
  </header>

  <main class="sim-main {{LAYOUT_CLASS}}">
    <section class="sim-stage">
      <!-- {{LAB_HTML}} -->
    </section>
    <!-- {{NOTES_HTML}} -->
  </main>
</div>
<div class="sim-toast" id="simToast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (n, d = 0) => n.toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
const pad2 = n => String(n).padStart(2, '0');
let _toastT = 0;
function toast(msg) {
  const el = $('#simToast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('on'), 2800);
}

/* --- YouTube IFrame API + tự động bật phụ đề tiếng Việt (CC vi) giống bản slide gốc --- */
let ytApiLoading = false;
const ytApiQueue = [];
function ensureYtApi(cb) {
  if (window.YT && window.YT.Player) { cb(); return; }
  ytApiQueue.push(cb);
  if (!ytApiLoading) {
    ytApiLoading = true;
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => {
      if (typeof prev === 'function') prev();
      while (ytApiQueue.length) ytApiQueue.shift()();
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    document.head.appendChild(s);
  }
}

function applyViCaptions(player) {
  try {
    player.loadModule?.('captions');
    const tracks = player.getOption?.('captions', 'tracklist') || [];
    const cur = player.getOption?.('captions', 'track') || {};
    const vi = tracks.find(t => t.languageCode === 'vi');
    if (vi) {
      player.setOption('captions', 'track', vi);
      return true;
    }
    const base = tracks[0] || (cur.languageCode ? cur : { languageCode: 'en', kind: 'asr', vss_id: 'a.en' });
    player.setOption('captions', 'track', {
      languageCode: base.languageCode,
      vss_id: base.vss_id,
      kind: base.kind,
      translationLanguage: { languageCode: 'vi', languageName: 'Tiếng Việt' }
    });
    return true;
  } catch (_) { return false; }
}

function attachYtViCaptions(iframe) {
  if (!iframe || iframe._ytAttached || !iframe.id) return;
  iframe._ytAttached = true;
  ensureYtApi(() => {
    try {
      iframe._ytPlayer = new window.YT.Player(iframe.id, {
        events: {
          onReady: e => applyViCaptions(e.target),
          onApiChange: e => applyViCaptions(e.target),
          onStateChange: e => {
            if (e.data === 1) {
              applyViCaptions(e.target);
              setTimeout(() => applyViCaptions(e.target), 450);
            }
          }
        }
      });
    } catch (_) { iframe._ytAttached = false; }
  });
}

function syncYtFrame(iframe, active = true) {
  if (!iframe) return;
  const fileBox = iframe.parentElement?.querySelector('[data-yt-file]');
  if (location.protocol === 'file:') {
    iframe.hidden = true;
    if (fileBox) fileBox.hidden = false;
  } else {
    iframe.hidden = false;
    if (fileBox) fileBox.hidden = true;
    if (active) {
      if (!iframe.getAttribute('src') && iframe.dataset.ytSrc) {
        iframe.addEventListener('load', () => attachYtViCaptions(iframe), { once: true });
        const sep = iframe.dataset.ytSrc.includes('?') ? '&' : '?';
        iframe.src = `${iframe.dataset.ytSrc}${sep}origin=${encodeURIComponent(location.origin)}`;
      } else {
        attachYtViCaptions(iframe);
      }
    } else {
      iframe._ytPlayer?.pauseVideo?.();
    }
  }
}

$$('[data-vid-switch]').forEach(seg => {
  const labEl = seg.closest('.lab');
  if (!labEl) return;
  const canvas = labEl.querySelector('.canvas-box canvas');
  const video = labEl.querySelector('.canvas-box video');
  const photo = labEl.querySelector('.canvas-box img');
  const ytWrap = labEl.querySelector('.canvas-box [data-yt-wrap]');
  const ytFrame = ytWrap?.querySelector('[data-yt-src]');
  const btns = $$('button', seg);
  btns.forEach(b => {
    b.onclick = () => {
      const mode = b.dataset.view;
      btns.forEach(x => x.classList.toggle('on', x === b));
      if (canvas) canvas.hidden = mode !== 'sim';
      if (video) {
        video.hidden = mode !== 'vid';
        if (mode === 'vid') video.play?.().catch(() => {});
        else video.pause?.();
      }
      if (photo) photo.hidden = mode !== 'img';
      if (ytWrap) {
        ytWrap.hidden = mode !== 'yt';
        syncYtFrame(ytFrame, mode === 'yt');
      }
      $$('[data-view-only]', labEl).forEach(el => {
        el.hidden = el.dataset.viewOnly !== mode;
      });
    };
  });
});
</script>
<script>
/* {{SIM_SCRIPTS}} */
</script>
</body>
</html>
